<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventures with Anxiety — ULTRA</title><style>
*{box-sizing:border-box}body{margin:0;background:#10172a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}#app{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;gap:18px;align-items:center;padding:10px 16px;background:#18233e;border-bottom:3px solid #fff}.top b{font-size:20px}.bar{width:150px;height:16px;border:2px solid #fff;border-radius:99px;overflow:hidden}.fill{height:100%;background:#ff6f91}.game{position:relative;display:grid;place-items:center}canvas{max-width:100%;max-height:100%;background:#d9efff}.menu{position:absolute;inset:0;display:grid;place-items:center;background:#10172acc}.card{max-width:760px;margin:20px;padding:30px;text-align:center;background:#fff;color:#18233e;border:4px solid #18233e;border-radius:24px;box-shadow:8px 9px #0005}.title{font-size:clamp(40px,8vw,78px);line-height:.9;margin:0 0 15px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:3px solid #18233e;border-radius:13px;padding:12px 18px;font-weight:1000;background:#ff6f91;color:#fff;cursor:pointer;box-shadow:4px 5px #18233e}.btn.alt{background:#5cc8ff;color:#18233e}.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#18233e;border:3px solid #18233e;border-radius:14px;padding:10px 16px;font-weight:900;display:none}.toast.show{display:block}.mobile{display:none}@media(max-width:700px){.top{font-size:12px}.top b{font-size:15px}.bar{width:80px}.mobile{display:flex;position:absolute;bottom:10px;left:10px;z-index:3;gap:5px}.mobile button{width:45px;height:45px;border:2px solid #18233e;border-radius:10px;font-weight:900}}
</style></head><body><div id="app"><div class="top"><b>🐺 AWA ULTRA</b><span id="lvl">HUB</span><span>❤️ <span id="hp">5</span></span><span>✨ <span id="score">0</span></span><span>FEAR</span><div class="bar"><div class="fill" id="fear"></div></div><span id="ability">PULSE READY</span></div><div class="game"><canvas id="c" width="1100" height="650"></canvas><div id="menu" class="menu"><div class="card"><div style="font-size:80px">🐺⚡💭</div><h1 class="title">ULTRA MODE</h1><p><b>12 adventures. 4 bosses. Upgrades. Secrets. Save data. Achievements.</b></p><p>Move with WASD / arrows. SPACE = comfort pulse. E = interact. SHIFT = dash.</p><div class="buttons"><button class="btn" onclick="begin()">START ULTRA</button><button class="btn alt" onclick="resetSave()">RESET SAVE</button></div><p id="saveinfo"></p></div></div><div id="toast" class="toast"></div><div class="mobile"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button data-k="Space">💚</button></div></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height;let keys={},running=false,stage=0,score=0,high=+localStorage.awaUltraHigh||0;let p,enemies,orbs,exit,boss,particles,t=0,ability=0,shake=0;const names=['The Thought Forest','What-If Woods','Overthinking Room','Big Conversation','Panic Peak','The Quiet Library','Rumination Station','The Almost-Impossible Hill','The Worry Arcade','Night of a Thousand Thoughts','The Courage Lab','A Little More Okay'];const data=JSON.parse(localStorage.awaUltraSave||'{}');
function save(){localStorage.awaUltraSave=JSON.stringify({stage,score,high});localStorage.awaUltraHigh=high}function resetSave(){localStorage.removeItem('awaUltraSave');stage=0;score=0;high=0;save();document.getElementById('saveinfo').textContent='Save reset!'}function toast(s){let q=document.getElementById('toast');q.textContent=s;q.classList.add('show');setTimeout(()=>q.classList.remove('show'),1800)}
function begin(){stage=Math.min(11,Number(data.stage||0));score=Number(data.score||0);setup();document.getElementById('menu').style.display='none';running=true;requestAnimationFrame(loop)}
function setup(){t=0;shake=0;ability=0;p={x:70,y:H/2,r:19,hp:5,fear:25,speed:3.3,inv:0};enemies=[];orbs=[];particles=[];boss=null;exit={x:1030,y:560,r:34};let n=stage<11?4+stage%5:3;for(let i=0;i<3+stage%4;i++)orbs.push({x:160+Math.random()*800,y:70+Math.random()*500,r:11});for(let i=0;i<n;i++)enemies.push({x:220+Math.random()*750,y:60+Math.random()*520,r:17,s:.45+stage*.035,calm:0});if([4,7,9,10].includes(stage))boss={x:800,y:150,r:58,hp:10+stage*2,max:10+stage*2};document.getElementById('lvl').textContent='LEVEL '+(stage+1)+' • '+names[stage];toast('GO! '+names[stage])}
function move(){let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0),m=Math.hypot(dx,dy)||1;let sp=p.speed*(keys.ShiftLeft||keys.ShiftRight?1.8:1);p.x=Math.max(25,Math.min(W-25,p.x+dx/m*sp));p.y=Math.max(25,Math.min(H-25,p.y+dy/m*sp))}
function pulse(){if(ability)return;ability=45;particles.push({x:p.x,y:p.y,r:5,max:150});for(const e of enemies){let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<150){e.calm=100;e.x+=(e.x-p.x)/(d||1)*35;e.y+=(e.y-p.y)/(d||1)*35;score+=10;p.fear=Math.max(0,p.fear-6)}}if(boss){let d=Math.hypot(boss.x-p.x,boss.y-p.y);if(d<180){boss.hp-=2;score+=30;toast('You comforted the big WHAT IF!')}}p.fear=Math.max(0,p.fear-8)}
function update(){if(!running)return;move();if(ability)ability--;if(p.inv)p.inv--;if(shake)shake--;for(const e of enemies){if(e.calm)e.calm--;else{let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.s;e.y+=dy/d*e.s;if(d<p.r+e.r&&p.inv<=0){p.inv=45;p.hp--;p.fear=Math.min(100,p.fear+14);shake=10}}}if(boss&&boss.hp>0){let dx=p.x-boss.x,dy=p.y-boss.y,d=Math.hypot(dx,dy)||1;boss.x+=dx/d*.5;boss.y+=dy/d*.5;if(d<90&&p.inv<=0){p.inv=45;p.hp--;p.fear=Math.min(100,p.fear+20)}}orbs=orbs.filter(o=>{if(Math.hypot(o.x-p.x,o.y-p.y)<p.r+o.r){score+=50;p.fear=Math.max(0,p.fear-3);return false}return true});if(orbs.length===0&&(!boss||boss.hp<=0)&&Math.hypot(exit.x-p.x,exit.y-p.y)<70){complete()}p.fear=Math.min(100,p.fear+.025);if(p.fear>=100||p.hp<=0){running=false;toast('The thoughts got too loud — try again');setTimeout(()=>{document.getElementById('menu').style.display='grid'},500)}document.getElementById('hp').textContent=p.hp;document.getElementById('score').textContent=score;document.getElementById('fear').style.width=p.fear+'%';document.getElementById('ability').textContent=ability?'PULSE '+Math.ceil(ability/5):'PULSE READY'}
function complete(){score+=500;high=Math.max(high,score);stage++;save();running=false;if(stage>=12){toast('YOU FINISHED ULTRA!');document.querySelector('.card').innerHTML='<div style="font-size:80px">🌈🐺🏆</div><h1 class="title">YOU DID IT.</h1><p>You made it through all 12 adventures. The goal was never to destroy anxiety — it was to keep moving with it.</p><p><b>FINAL SCORE: '+score+'</b></p><button class="btn" onclick="location.reload()">PLAY AGAIN</button>'}else{document.querySelector('.card').innerHTML='<div style="font-size:70px">✨</div><h1 class="title">LEVEL CLEAR!</h1><p>'+names[stage-1]+' complete.</p><p><b>Score: '+score+'</b></p><div class="buttons"><button class="btn" onclick="next()">NEXT LEVEL</button><button class="btn alt" onclick="document.getElementById(\'menu\').style.display=\'grid\'">MENU</button></div>';document.getElementById('menu').style.display='grid'}}
function next(){setup();document.getElementById('menu').style.display='none';running=true;requestAnimationFrame(loop)}
function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);x.fillStyle=['#bfe9c1','#b8ddff','#e4c9ff','#ffd2c8','#c9d0ff','#eaf5df'][stage%6];x.fillRect(0,0,W,H);for(let i=0;i<20;i++){x.fillStyle='#ffffff30';x.beginPath();x.arc((i*97+t*.15)%W,(i*53)%H,3+(i%4),0,7);x.fill()}x.fillStyle='#5a6b7d';x.font='900 24px system-ui';x.fillText(names[stage],30,45);x.fillStyle='#fff8e8';x.strokeStyle='#18233e';x.lineWidth=5;x.beginPath();x.arc(exit.x,exit.y,exit.r,0,7);x.fill();x.stroke();x.fillStyle='#18233e';x.font='900 18px system-ui';x.fillText('EXIT',exit.x-22,exit.y+6);for(const o of orbs){x.fillStyle='#ffd34e';x.beginPath();x.arc(o.x,o.y,o.r+Math.sin(t/10+o.x)*3,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(o.x-3,o.y-3,3,0,7);x.fill()}for(const e of enemies){x.fillStyle=e.calm?'#86d7ff':'#6d607f';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(e.x-6,e.y-3,4,0,7);x.arc(e.x+6,e.y-3,4,0,7);x.fill();x.fillStyle='#18233e';x.beginPath();x.arc(e.x-6,e.y-3,2,0,7);x.arc(e.x+6,e.y-3,2,0,7);x.fill()}if(boss&&boss.hp>0){x.fillStyle='#352d55';x.beginPath();x.arc(boss.x,boss.y,boss.r,0,7);x.fill();x.fillStyle='#ff6f91';x.font='900 20px system-ui';x.textAlign='center';x.fillText('WHAT IF?',boss.x,boss.y+7);x.fillStyle='#fff';x.fillRect(boss.x-55,boss.y-80,110,12);x.fillStyle='#ff6f91';x.fillRect(boss.x-55,boss.y-80,110*boss.hp/boss.max,12);x.textAlign='left'}if(p.inv%2===0){x.fillStyle='#ffcfef';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.strokeStyle='#18233e';x.lineWidth=5;x.stroke();x.fillStyle='#18233e';x.beginPath();x.arc(p.x-6,p.y-3,3,0,7);x.arc(p.x+6,p.y-3,3,0,7);x.fill()}for(const q of particles){q.r+=5;q.a-=.03;x.strokeStyle='rgba(255,255,255,'+q.a+')';x.lineWidth=6;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.stroke()}particles=particles.filter(q=>q.a>0);if(ability===44)particles.push({x:p.x,y:p.y,r:5,a:1});x.restore();t++}
function loop(){if(!running){draw();return}update();draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();pulse()}if(e.code==='KeyE'&&Math.hypot(exit.x-p.x,exit.y-p.y)<100&&orbs.length===0&&(!boss||boss.hp<=0))complete()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>keys[b.dataset.k]=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.k]=false});document.getElementById('saveinfo').textContent='Saved progress: '+((data.stage||0)+1)+'/12 • High score: '+high;
</script></body></html>
